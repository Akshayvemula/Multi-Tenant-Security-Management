services:
  postgres:
    image: postgres:16-alpine
    container_name: deep-trace-postgres
    environment:
      POSTGRES_DB: deep_trace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deep_trace"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

